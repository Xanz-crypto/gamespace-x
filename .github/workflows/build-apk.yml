name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip, add Capacitor, build web
        run: |
          mkdir app
          unzip -q "$(ls *.zip | head -1)" -d app
          APPDIR=$(dirname "$(find app -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APPDIR=$APPDIR" >> $GITHUB_ENV
          cd "$APPDIR"
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@^7.4.0 @capacitor/android@^7.4.0 @capacitor/cli@^7.4.0
          echo '{"appId":"com.gamespacex.app","appName":"GameSpace X","webDir":"dist"}' > capacitor.config.json
          npm run build

      - name: Build debug APK
        run: |
          cd "$APPDIR"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GameSpaceX.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GameSpaceX-apk
          path: GameSpaceX.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameSpace X build ${{ github.run_number }}
          files: GameSpaceX.apk
